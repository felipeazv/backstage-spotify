# Kubernetes deployment for sample-service
# Deploy to minikube:
#   kubectl apply -f k8s/
#   kubectl port-forward -n apps svc/sample-service 8080:8080
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-service-db-config
  namespace: apps
data:
  DB_HOST: "sample-service-postgres.apps.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "sample-service_db"
  DB_USER: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: sample-service-db-secret
  namespace: apps
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sample-service-postgres
  namespace: apps
  labels:
    app: sample-service-postgres
    app.kubernetes.io/name: sample-service-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: sample-service-postgres
  replicas: 1
  selector:
    matchLabels:
      app: sample-service-postgres
  template:
    metadata:
      labels:
        app: sample-service-postgres
        app.kubernetes.io/name: sample-service-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sample-service-db-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: sample-service-db-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-service-db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d sample-service_db
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d sample-service_db
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      securityContext:
        fsGroup: 999
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-service-postgres
  namespace: apps
  labels:
    app: sample-service-postgres
spec:
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: sample-service-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  namespace: apps
  labels:
    app: sample-service
    app.kubernetes.io/name: sample-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-service
  template:
    metadata:
      labels:
        app: sample-service
        app.kubernetes.io/name: sample-service
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35
          command:
            - 'sh'
            - '-c'
            - 'until nc -z sample-service-postgres.apps.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;'
      containers:
        - name: sample-service
          image: hashicorp/http-echo:0.2.3
          args:
            - "-text=[{\"id\":1,\"alias\":\"persuasive-donkey\"},{\"id\":2,\"alias\":\"hopeful-stair\"},{\"id\":3,\"alias\":\"curious-mountain\"}]"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sample-service
  namespace: apps
  labels:
    app: sample-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: sample-service
