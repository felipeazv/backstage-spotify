version: '3.8'

services:
  spring-boot-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m
{%- if values.usePostgres %}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME={{ values.name }}_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
{%- endif %}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network
{%- if values.usePostgres %}
    depends_on:
      postgres:
        condition: service_healthy
{%- endif %}

{%- if values.usePostgres %}
  postgres:
    image: postgres:16-alpine
    container_name: {{ values.name }}-postgres
    environment:
      POSTGRES_DB: {{ values.name }}_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d {{ values.name }}_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
{%- endif %}

networks:
  app-network:
    driver: bridge

{%- if values.usePostgres %}
volumes:
  postgres-data:
    driver: local
{%- endif %}
