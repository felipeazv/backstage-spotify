# Kubernetes deployment for {{ values.name }}
# Deploy to minikube:
#   kubectl apply -f k8s/
#   kubectl port-forward -n {{ values.namespace }} svc/{{ values.name }} 8080:8080
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ values.namespace }}
{%- if values.usePostgres %}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ values.name }}-db-config
  namespace: {{ values.namespace }}
data:
  DB_HOST: "{{ values.name }}-postgres.{{ values.namespace }}.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "{{ values.name }}_db"
  DB_USER: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ values.name }}-db-secret
  namespace: {{ values.namespace }}
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ values.name }}-postgres
  namespace: {{ values.namespace }}
  labels:
    app: {{ values.name }}-postgres
    app.kubernetes.io/name: {{ values.name }}-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: {{ values.name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ values.name }}-postgres
  template:
    metadata:
      labels:
        app: {{ values.name }}-postgres
        app.kubernetes.io/name: {{ values.name }}-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ values.name }}-db-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ values.name }}-db-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ values.name }}-db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d {{ values.name }}_db
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d {{ values.name }}_db
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      securityContext:
        fsGroup: 999
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ values.name }}-postgres
  namespace: {{ values.namespace }}
  labels:
    app: {{ values.name }}-postgres
spec:
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: {{ values.name }}-postgres
{%- endif %}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ values.name }}
  namespace: {{ values.namespace }}
  labels:
    app: {{ values.name }}
    app.kubernetes.io/name: {{ values.name }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ values.name }}
  template:
    metadata:
      labels:
        app: {{ values.name }}
        app.kubernetes.io/name: {{ values.name }}
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
{%- if values.usePostgres %}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35
          command:
            - 'sh'
            - '-c'
            - 'until nc -z {{ values.name }}-postgres.{{ values.namespace }}.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;'
{%- endif %}
      containers:
        - name: {{ values.name }}
          image: ghcr.io/{{ values.repoOwner }}/{{ values.repoName }}:latest
          imagePullPolicy: Always  # Pull from GitHub Container Registry
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
{%- if values.usePostgres %}
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ values.name }}-db-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ values.name }}-db-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ values.name }}-db-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ values.name }}-db-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ values.name }}-db-secret
                  key: DB_PASSWORD
{%- endif %}
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ values.name }}
  namespace: {{ values.namespace }}
  labels:
    app: {{ values.name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: {{ values.name }}
