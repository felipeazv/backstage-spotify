# Backstage Kubernetes Deployment for Minikube (with SQLite - no PostgreSQL needed)
# Based on: https://backstage.io/docs/deployment/k8s
# 
# Usage:
#   1. Create secrets first (see below)
#   2. Build the image: eval $(minikube docker-env) && docker build -f packages/backend/Dockerfile -t backstage:v5 .
#   3. Apply: kubectl apply -f kubernetes-backstage-minikube.yaml
#   4. Port-forward: kubectl port-forward -n backstage svc/backstage 7007:7007
#   5. Access: http://localhost:7007
#
# Create secrets with:
#   kubectl create secret generic backstage-secrets -n backstage \
#     --from-literal=GITHUB_CLIENT_ID=<your-github-client-id> \
#     --from-literal=GITHUB_CLIENT_SECRET=<your-github-client-secret> \
#     --from-literal=GOOGLE_CLIENT_ID=<your-google-client-id> \
#     --from-literal=GOOGLE_CLIENT_SECRET=<your-google-client-secret> \
#     --from-literal=GITHUB_TOKEN=<your-github-token>
---
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: backstage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-app-config
  namespace: backstage
data:
  # Override production config to use SQLite instead of PostgreSQL
  app-config.local.yaml: |
    app:
      baseUrl: http://localhost:7007

    backend:
      baseUrl: http://localhost:7007
      listen: ':7007'
      # Use SQLite instead of PostgreSQL for local development
      database:
        client: better-sqlite3
        connection: ':memory:'

    # Auth providers - override resolvers to not require catalog User entities
    auth:
      providers:
        guest: {}
        github:
          development:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                # Use emailMatchingUserEntityProfileEmail which creates users dynamically
                - resolver: usernameMatchingUserEntityName
        google:
          development:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityAnnotation

    # Override catalog locations with absolute paths for container environment
    catalog:
      locations:
        - type: file
          target: /app/examples/entities.yaml
        - type: file
          target: /app/examples/template/template.yaml
          rules:
            - allow: [Template]
        - type: file
          target: /app/examples/template/spring-boot-service-template.yaml
          rules:
            - allow: [Template]
        - type: file
          target: /app/examples/org.yaml
          rules:
            - allow: [User, Group]
        - type: file
          target: /app/examples/users/felipe.yaml
          rules:
            - allow: [User]
        - type: url
          target: https://github.com/felipeazv/hello-spring-boot-backstage/blob/main/catalog-info.yaml
          rules:
            - allow: [Component]
        - type: file
          target: /backstage-templates/spring-boot-service-template.yaml
          rules:
            - allow: [Template]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-templates
  namespace: backstage
data:
  spring-boot-service-template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: spring-boot-service-template
      title: Spring Boot Service Template
      description: A template for creating Spring Boot services with optional PostgreSQL support
      tags:
        - spring
        - java
        - service
    spec:
      owner: devops
      type: service
      parameters:
        - title: Service Information
          required:
            - name
            - description
            - repoUrl
          properties:
            name:
              title: Service Name
              type: string
              description: The name of the Spring Boot service
              ui:autofocus: true
              ui:options:
                rows: 1
            description:
              title: Service Description
              type: string
              description: A brief description of the service
              ui:field: MarkdownField
              ui:widget: textarea
            repoUrl:
              title: Repository URL
              type: string
              description: The GitHub repository URL for the service
              ui:field: RepoUrlPicker
              ui:options:
                allowedHosts:
                  - github.com
        - title: Configuration & Deployment
          properties:
            package:
              title: Package Name
              type: string
              description: The Java package name for the service (e.g., com.example.service)
              default: com.example.service
            javaVersion:
              title: Java Version
              type: string
              enum: ['17', '21']
              default: '21'
            version:
              title: Spring Boot Version
              type: string
              enum: ['3.2.0', '3.4.2']
              default: '3.4.2'
            namespace:
              title: Kubernetes Namespace
              type: string
              description: The Kubernetes namespace to deploy the service to
              default: apps
            usePostgres:
              title: Use PostgreSQL
              type: boolean
              description: Enable PostgreSQL as the persistence layer with Flyway migrations
              default: false
              ui:widget: checkbox
      steps:
        - id: fetch-template
          name: Fetch Template
          action: fetch:template
          input:
            url: https://github.com/felipeazv/backstage-spotify/tree/main/examples/template/hello-spring-boot
            values:
              name: '${{ parameters.name }}'
              description: '${{ parameters.description }}'
              repoUrl: '${{ parameters.repoUrl }}'
              package: '${{ parameters.package }}'
              javaVersion: '${{ parameters.javaVersion }}'
              version: '${{ parameters.version }}'
              namespace: '${{ parameters.namespace }}'
              usePostgres: '${{ parameters.usePostgres }}'
              repoOwner: '${{ (parameters.repoUrl | parseRepoUrl).owner }}'
              repoName: '${{ (parameters.repoUrl | parseRepoUrl).repo }}'
        - id: publish
          name: Publish
          action: publish:github
          input:
            allowedHosts: ['github.com']
            description: 'Create a new repo with Spring Boot service'
            repoUrl: '${{ parameters.repoUrl }}'
            repoVisibility: public
        - id: register
          name: Register in Catalog
          action: catalog:register
          input:
            repoContentsUrl: '${{ steps["publish"].output.repoContentsUrl }}'
            catalogInfoPath: '/catalog-info.yaml'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: backstage
      containers:
        - name: backstage
          image: backstage:v5
          imagePullPolicy: Never  # Use local image from minikube's Docker
          # Override the CMD to include local config that uses SQLite
          command: ["node", "packages/backend", "--config", "app-config.yaml", "--config", "app-config.local.yaml"]
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            # GitHub OAuth credentials
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: GITHUB_CLIENT_SECRET
            # Google OAuth credentials
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: GOOGLE_CLIENT_SECRET
            # GitHub Token for integrations
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: app-config
              mountPath: /app/app-config.local.yaml
              subPath: app-config.local.yaml
              readOnly: true
            - name: backstage-templates
              mountPath: /backstage-templates
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-config
          configMap:
            name: backstage-app-config
        - name: backstage-templates
          configMap:
            name: backstage-templates
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 7007
      targetPort: http
      protocol: TCP
